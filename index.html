<style>
/* Pixel-art look: a 16-colour palette, hard edges, notched corners, stepped motion. */
:root {
  --ink: #1a1c2c; --bg: #20243f; --panel: #29366f; --panel-2: #333c57; --edge: #566c86; --edge-2: #94b0c2;
  --text: #f4f4f4; --muted: #b9c8d6; --faint: #7f93a8;
  --amber: #ffcd75; --green: #a7f070; --green-dk: #38b764; --red: #ff5a6a; --red-dk: #b13e53; --paper: #f4ecd0;
  --m0: #3b4a6b; --m1: #ef5d6c; --m2: #41a6f6; --m3: #a7f070;
  --lc: #ffcd75; --p: 4px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  /* notched (pixel-rounded) corners */
  --notch: polygon(0 var(--p), var(--p) var(--p), var(--p) 0, calc(100% - var(--p)) 0, calc(100% - var(--p)) var(--p), 100% var(--p), 100% calc(100% - var(--p)), calc(100% - var(--p)) calc(100% - var(--p)), calc(100% - var(--p)) 100%, var(--p) 100%, var(--p) calc(100% - var(--p)), 0 calc(100% - var(--p)));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border-radius: 0; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font: 16px/1.45 var(--sans); overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 4px solid var(--text); outline-offset: -4px; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
.px { height: 14px; width: auto; flex: none; }
.px-icon { height: 21px; }
.px-fallback { font: 800 1em/1 var(--sans); white-space: nowrap; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font: 700 11.5px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.app { position: relative; max-width: 520px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg);
  background-image: linear-gradient(45deg, rgba(255, 255, 255, .025) 25%, transparent 25% 75%, rgba(255, 255, 255, .025) 75%), linear-gradient(45deg, rgba(255, 255, 255, .025) 25%, transparent 25% 75%, rgba(255, 255, 255, .025) 75%);
  background-size: 8px 8px; background-position: 0 0, 4px 4px; box-shadow: 0 0 0 4px #000; }
.screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.pad { padding: 12px 16px 28px; }
.view-in { animation: viewIn .28s steps(4) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(12px); } }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- nav ---------- */
.nav { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--ink); border-top: 4px solid var(--edge); padding: 0 6px env(safe-area-inset-bottom); position: relative; z-index: 2; }
.nav.hidden { display: none; }
.nav button { display: grid; justify-items: center; gap: 6px; padding: 10px 0 9px; color: var(--faint); position: relative; }
.nav button span { font: 700 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.nav button .px-icon { height: 21px; }
.nav button.on { color: var(--ink); background: var(--amber); }
.nav button:active { transform: translateY(2px); }
.nav em { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 16px; padding: 0 4px; background: var(--red); color: var(--ink); font: 800 10.5px/16px var(--mono); font-style: normal; text-align: center; box-shadow: 0 0 0 2px var(--ink); }

/* ---------- header ---------- */
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; background: var(--bg); border-bottom: 4px solid var(--ink); }
.mark { display: flex; align-items: center; gap: 9px; margin-right: auto; min-width: 0; }
.mark i { width: 8px; height: 8px; background: var(--green); flex: none; animation: blink 1.2s steps(1) infinite; box-shadow: 0 0 0 2px var(--ink); }
.mark b { display: block; min-width: 0; font-size: 15px; letter-spacing: .1em; } .mark .px { height: 14px; }
.sample { font: 700 10px/1 var(--mono); letter-spacing: .1em; padding: 4px 5px; background: var(--amber); color: var(--ink); white-space: nowrap; }
.odo { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 13px; } .odo .px { height: 10.5px; } .odo small { color: var(--muted); font: 700 10px/1 var(--mono); }
.clock { color: var(--amber); font-size: 13px; } .clock .px { height: 10.5px; }

/* ---------- buttons, panels ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 20px 4px; width: 100%; font: 800 15.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--lc); clip-path: var(--notch);
  box-shadow: inset 0 4px 0 rgba(255, 255, 255, .45), inset 0 -8px 0 rgba(0, 0, 0, .28), inset 4px 0 0 rgba(255, 255, 255, .2), inset -4px 0 0 rgba(0, 0, 0, .15); }
.btn.big { min-height: 60px; font-size: 17px; }
.btn:active:not([disabled]) { padding: 4px 20px 0; box-shadow: inset 0 4px 0 rgba(0, 0, 0, .28), inset 0 -4px 0 rgba(255, 255, 255, .25); }
.btn[disabled] { background: var(--panel-2); color: var(--faint); box-shadow: inset 0 0 0 4px var(--edge); cursor: default; padding-bottom: 0; }
.btn.ghost { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 4px var(--edge); padding-bottom: 0; }
.btn.good { --lc: var(--green); } .btn.bad { --lc: var(--red); }
.btn .px-icon { height: 14px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text); background: var(--ink); clip-path: var(--notch); flex: none; }
.icon-btn .px-icon { height: 14px; } .icon-btn:active { transform: translateY(2px); } .icon-btn.flagged { color: var(--ink); background: var(--amber); }
.panel { display: block; width: 100%; text-align: left; background: var(--panel); border: 4px solid var(--ink); box-shadow: inset 0 0 0 4px var(--edge); padding: 20px; margin-bottom: 14px; clip-path: var(--notch); }
.roundel { flex: none; width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink); background: var(--lc); clip-path: var(--notch); font-size: 13px; } .roundel .px { height: 14px; }
.dot { display: inline-block; width: 8px; height: 8px; background: var(--lc); margin-right: 8px; box-shadow: 0 0 0 2px var(--ink); }

/* ---------- departure board ---------- */
.board { position: relative; padding: 18px; background: var(--ink); border: 4px solid var(--ink); box-shadow: inset 0 0 0 4px var(--lc); clip-path: var(--notch); }
.board-top { display: flex; align-items: center; gap: 10px; } .board-top .label:first-child { margin-right: auto; } .board-top .label + .label { color: var(--amber); }
.dep-lamp { width: 12px; height: 12px; background: var(--panel-2); box-shadow: 0 0 0 2px var(--edge); }
.dep-lamp.ready { background: var(--green); animation: blink 1s steps(1) infinite; } .dep-lamp.cleared { background: var(--lc); } .dep-lamp.locked { background: var(--red); }
.dep-line { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
.dep-name { font-size: 23px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.led-row { height: 36px; display: flex; align-items: center; padding: 0 10px; margin-bottom: 4px; color: var(--amber); font-size: 17px; overflow: hidden;
  background-color: #0d0e17; background-image: radial-gradient(circle, #2a2d44 1px, transparent 1.2px); background-size: 4px 4px; }
.led-row .px { height: 16px; max-width: 100%; }
.led-row.wipe > * { animation: wipe .32s steps(8) both; }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.dep-hint { min-height: 20px; font-size: 13px; color: var(--muted); margin: 8px 0 10px; }

/* ---------- home: station scene ---------- */
.hero { position: relative; height: 176px; background: var(--ink); border-bottom: 4px solid var(--ink); overflow: hidden; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
.station-sign { position: absolute; left: 14px; top: 30px; display: flex; align-items: center; padding: 7px 10px; background: #29366f; color: var(--text); box-shadow: inset 0 0 0 2px var(--text), 0 4px 0 var(--ink); font-size: 15px; }
.station-sign::before, .station-sign::after { content: ""; position: absolute; top: -8px; width: 2px; height: 8px; background: #333c57; }
.station-sign::before { left: 12px; } .station-sign::after { right: 12px; }
.station-sign .px { height: 10.5px; }
.greet { position: absolute; left: 14px; top: 68px; padding: 4px 7px; background: rgba(26, 28, 44, .82); font: 700 11px/1.3 var(--mono); color: var(--text); max-width: calc(100% - 28px); }

/* ---------- home: today's instruments ---------- */
.dash { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 4px; margin-top: 14px; padding: 4px; background: var(--ink); clip-path: var(--notch); }
.gauge { display: grid; align-content: start; gap: 8px; padding: 10px; background: #0d0e17; text-align: left; min-width: 0; }
.gauge .label { font-size: 9.5px; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.gauge:active { transform: translateY(2px); }
.gnum { display: flex; align-items: center; gap: 6px; color: var(--amber); min-height: 18px; }
.gnum .px { height: 17.5px; } .gnum .px-icon { height: 14px; }
.gnum em { font: 800 10px/1 var(--mono); color: var(--muted); font-style: normal; align-self: flex-end; }
.gauge .flame { color: #ef7d57; display: flex; } .gauge .flame.off { color: var(--edge); }
.gauge.warn .gnum { color: var(--red); }
.cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 8px; }
.cells i { background: var(--panel-2); } .cells i.on { background: var(--green); }

/* ---------- home: platform signs ---------- */
.plats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 26px; }
.plat { position: relative; display: grid; justify-items: center; gap: 6px; padding: 12px 6px 16px; background: #29366f; text-align: center; box-shadow: inset 0 0 0 2px var(--text), inset 0 -6px 0 rgba(0, 0, 0, .3), 0 4px 0 var(--ink); }
.plat::before, .plat::after { content: ""; position: absolute; top: -12px; width: 4px; height: 12px; background: var(--edge); }
.plat::before { left: 18%; } .plat::after { right: 18%; }
.plat:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--text), 0 1px 0 var(--ink); }
.plat-no { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px; display: grid; place-items: center; background: var(--text); color: var(--ink); } .plat-no .px { height: 10.5px; }
.plat .label { font-size: 9px; letter-spacing: .06em; padding-left: 18px; }
.plat-ico { width: 38px; height: 38px; display: grid; place-items: center; background: var(--amber); color: var(--ink); clip-path: var(--notch); } .plat-ico .px-icon { height: 21px; }
.plat b { font-size: 13.5px; font-weight: 800; line-height: 1.2; }

/* ---------- home: lines drawn as trains ---------- */
.fleet { margin-top: 28px; }
.ln { margin-bottom: 20px; }
.ln-top { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0 2px; text-align: left; }
.ln-name { display: grid; min-width: 0; flex: 1; gap: 2px; }
.ln-top b { font-size: 15.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln-pct { font-size: 14px; font-weight: 800; color: var(--lc); }
.consist { overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 22px 16px 0; } .consist::-webkit-scrollbar { display: none; }
.consist-in { position: relative; display: flex; align-items: flex-end; gap: 6px; width: max-content; min-width: 100%; padding: 0 24px 16px 0;
  background: linear-gradient(#333c57, #333c57) 0 calc(100% - 34px) / 100% 4px no-repeat; }
.consist-in::before { content: ""; position: absolute; left: -16px; right: 0; bottom: 0; height: 6px; background: repeating-linear-gradient(90deg, #4b3a3a 0 6px, transparent 6px 14px); }
.consist-in::after { content: ""; position: absolute; left: -16px; right: 0; bottom: 6px; height: 4px; background: var(--edge-2); box-shadow: 0 -2px 0 #c7d3de inset; }
.nose { position: relative; width: 86px; height: 46px; background: var(--text);
  clip-path: polygon(100% 0, 46px 0, 46px 4px, 34px 4px, 34px 8px, 24px 8px, 24px 12px, 16px 12px, 16px 16px, 10px 16px, 10px 20px, 4px 20px, 4px 28px, 0 28px, 0 42px, 4px 42px, 4px 46px, 100% 46px);
  background-image: linear-gradient(var(--lc), var(--lc)), linear-gradient(#94b0c2, #94b0c2); background-size: 100% 4px, 100% 4px; background-position: 0 30px, 0 42px; background-repeat: no-repeat; }
.nose::before { content: ""; position: absolute; left: 14px; top: 13px; width: 40px; height: 8px; background: #29366f; clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 4px, 6px 4px, 6px 0); }
.nose .dest { position: absolute; right: 8px; top: 8px; padding: 3px 4px; background: #0d0e17; color: var(--amber); } .nose .dest .px { height: 7px; }
.nose .hl { position: absolute; left: 6px; top: 34px; width: 6px; height: 4px; background: #ffcd75; box-shadow: 0 0 0 2px #fff6; animation: blink 1.6s steps(1) infinite; }
.car { position: relative; flex: none; width: 72px; height: 46px; background: var(--text); box-shadow: inset 0 -4px 0 #94b0c2, inset 0 4px 0 #c7d3de; }
.car::before { content: ""; position: absolute; left: 0; right: 0; top: 30px; height: 4px; background: var(--lc); }
.car::after, .nose-wrap::after { content: ""; position: absolute; bottom: -10px; left: 8px; width: 8px; height: 6px; background: var(--ink); box-shadow: 12px 0 0 var(--ink), 40px 0 0 var(--ink), 52px 0 0 var(--ink); }
.nose-wrap { position: relative; flex: none; } .nose-wrap::after { left: 50px; box-shadow: 14px 0 0 var(--ink); }
.car .wins { position: absolute; left: 6px; right: 20px; top: 10px; display: flex; gap: 4px; } .car .wins i { flex: 1; height: 10px; background: #29366f; }
.car .door { position: absolute; right: 6px; top: 8px; width: 9px; height: 30px; background: #c7d3de; box-shadow: inset 0 0 0 2px #94b0c2; }
.car .car-no { position: absolute; left: 6px; bottom: 6px; color: #566c86; } .car .car-no .px { height: 7px; }
.tagtop { position: absolute; top: -14px; right: 4px; min-width: 22px; height: 20px; padding: 0 4px; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--ink); }
.tagtop .px { height: 10.5px; } .tagtop .px-icon { height: 10.5px; }
.tagtop.grade { background: var(--lc); color: var(--ink); }
.tagtop.go { background: var(--amber); color: var(--ink); animation: bob .8s steps(2) infinite; }
.tagtop.lock { background: var(--panel-2); color: var(--muted); }
.car.done .wins i { background: #ffcd75; box-shadow: inset 0 -3px 0 #ef7d57; }
.car.cur .wins i { background: #73eff7; }
.car.cur .door { background: var(--ink); box-shadow: inset 0 0 0 2px #94b0c2; animation: blink 1s steps(1) infinite; }
.car.locked { background: #94b0c2; box-shadow: inset 0 -4px 0 #566c86, inset 0 4px 0 #b9c8d6; }
.car.locked::before { background: #566c86; } .car.locked .wins i { background: #333c57; } .car.locked .door { background: #94b0c2; box-shadow: inset 0 0 0 2px #7f93a8; }
.car.sel { outline: 4px solid var(--text); outline-offset: 3px; z-index: 1; }
.car:active { transform: translateY(2px); }
.works { position: relative; display: flex; align-items: center; gap: 12px; height: 54px; margin-top: 10px; padding: 0 4px 10px; }
.works::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: repeating-linear-gradient(90deg, var(--edge) 0 8px, transparent 8px 16px); }
.works .label { flex: 1; text-align: center; }
.barrier { width: 46px; height: 16px; background: repeating-linear-gradient(90deg, var(--red) 0 8px, var(--text) 8px 16px); box-shadow: 0 0 0 2px var(--ink); position: relative; }
.barrier::before, .barrier::after { content: ""; position: absolute; top: 16px; width: 4px; height: 14px; background: var(--edge); } .barrier::before { left: 4px; } .barrier::after { right: 4px; }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(26, 28, 44, .82); display: flex; align-items: flex-end; justify-content: center; animation: fade .12s steps(2) both; }
.scrim.center { align-items: center; padding: 22px; } .scrim.out { animation: fade .12s steps(2) reverse both; }
@keyframes fade { from { opacity: 0; } }
.sheet, .dialog { background: var(--panel); border: 4px solid var(--ink); box-shadow: inset 0 0 0 4px var(--edge-2); }
.sheet { width: 100%; max-width: 520px; padding: 18px 20px calc(22px + env(safe-area-inset-bottom)); animation: sheetUp .24s steps(6) both; }
@keyframes sheetUp { from { transform: translateY(100%); } }
.sheet .grab { display: none; }
.sheet h3, .dialog h3 { font-size: 19px; font-weight: 800; }
.dialog { width: 100%; max-width: 380px; padding: 24px; text-align: center; animation: dlg .16s steps(3) both; max-height: 86vh; overflow-y: auto; clip-path: var(--notch); }
.dialog.left { text-align: left; }
@keyframes dlg { from { transform: scale(.8); opacity: 0; } }
.dialog .row { display: grid; gap: 10px; margin-top: 18px; } .dialog p { margin-top: 6px; }

/* ---------- run ---------- */
.run { height: 100%; display: flex; flex-direction: column; position: relative; }
.cab { position: relative; height: clamp(120px, 27vh, 250px); flex: none; background: var(--ink); overflow: hidden; border-bottom: 4px solid var(--ink); }
.cab canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
.cab-top { position: absolute; inset: 8px 10px auto 8px; display: flex; align-items: center; gap: 8px; }
.cab-title { font: 800 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text); background: var(--ink); padding: 6px 8px; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.combo { font: 800 13px/1 var(--mono); padding: 6px 8px; color: var(--ink); background: var(--amber); box-shadow: 0 4px 0 var(--ink); visibility: hidden; white-space: nowrap; }
.combo.show { visibility: visible; animation: dlg .16s steps(3) both; }
.cab-hud { position: absolute; inset: auto 10px 8px 10px; display: flex; align-items: flex-end; justify-content: space-between; z-index: 1; pointer-events: none; }
.aspect { display: inline-flex; align-items: center; gap: 8px; padding: 6px 9px; background: var(--ink); font: 800 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; --c: var(--amber); box-shadow: inset 0 0 0 2px var(--c); }
.aspect i { width: 8px; height: 8px; background: var(--c); }
.aspect.clear { --c: var(--green); } .aspect.stop { --c: var(--red); } .aspect.caution i { animation: blink .6s steps(1) infinite; }
.speed { display: flex; align-items: flex-end; gap: 6px; background: var(--ink); padding: 7px 9px; }
.speed b { display: block; color: var(--text); } .speed .px { height: 28px; }
.speed small { font: 800 10px/1 var(--mono); color: var(--amber); letter-spacing: .08em; }
.blocks { display: flex; gap: 4px; padding: 8px 16px 0; flex: none; }

.q-card { animation: qIn .25s steps(5) both; } .q-card.leave { animation: qOut .15s steps(3) both; }

@keyframes qOut { to { opacity: 0; transform: translateX(-40px); } }
.q-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; font: 800 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; background: var(--lc); color: var(--ink); }

.opts { display: grid; gap: 10px; margin-top: 12px; }

  box-shadow: inset 0 0 0 4px var(--edge), inset 0 -8px 0 rgba(0, 0, 0, .3); animation: optIn .2s steps(4) both; animation-delay: calc(var(--i) * 50ms + 80ms); }

.opt.right { background: #2b5a4a; box-shadow: inset 0 0 0 4px var(--green), inset 0 -8px 0 rgba(0, 0, 0, .3); }

.opt.dim { opacity: .45; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* true/false lever */
.lever { display: grid; grid-template-columns: 1fr 104px 1fr; align-items: center; gap: 10px; margin-top: 16px; touch-action: pan-y; user-select: none; -webkit-user-select: none; animation: optIn .2s steps(4) .1s both; }
.lv-side { display: grid; justify-items: center; gap: 10px; padding: 18px 6px 22px; background: var(--panel); font: 800 15px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); clip-path: var(--notch); box-shadow: inset 0 0 0 4px var(--edge), inset 0 -8px 0 rgba(0, 0, 0, .3); }
.lv-ico { width: 44px; height: 44px; display: grid; place-items: center; background: var(--ink); clip-path: var(--notch); } .lv-ico .px-icon { height: 21px; }
.lv-side.sel { color: var(--text); background: #4a4a2c; box-shadow: inset 0 0 0 4px var(--amber), inset 0 -8px 0 rgba(0, 0, 0, .3); } .lv-side.sel .lv-ico { background: var(--amber); color: var(--ink); }

.knob { position: absolute; top: 8px; left: 50%; width: 32px; height: 32px; margin-left: -16px; background: var(--edge-2); box-shadow: inset 0 4px 0 var(--text), inset 0 -8px 0 var(--edge), inset 4px 0 0 var(--text), inset -4px 0 0 var(--edge); transition: left .15s steps(4); }
.lever[data-v="0"] .knob { left: 24px; } .lever[data-v="1"] .knob { left: calc(100% - 24px); }
.lever.drag .knob { transition: none; } .lever.locked .lv-track { cursor: default; } .lever .lv-side:disabled { cursor: default; }

.foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); position: relative; flex: none; }

.verdict { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--ink); border-top: 4px solid var(--c); animation: sheetUp .2s steps(5) both; z-index: 2; --c: var(--green); }

.verdict .head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.verdict .head b { font-size: 18px; font-weight: 800; color: var(--c); }

.detail { margin: 0 0 14px; max-height: 24vh; overflow-y: auto; padding: 12px; background: var(--panel); box-shadow: inset 0 0 0 4px var(--edge); }

/* ---------- running record (ticket) ---------- */
.ticket-view { min-height: 100%; display: flex; flex-direction: column; padding: 34px 20px calc(18px + env(safe-area-inset-bottom)); }
.slot { height: 12px; background: #000; box-shadow: 0 4px 0 var(--edge); margin: 0 -6px; position: relative; z-index: 1; }
.ticket-clip { overflow: hidden; padding: 0 0 30px; }
.ticket { background: var(--paper); color: var(--ink); padding: 20px 20px 18px; position: relative; animation: print .9s steps(18) both; --p: 8px; clip-path: var(--notch);
  box-shadow: inset 0 0 0 4px var(--ink), inset 0 0 0 8px var(--paper), inset 0 0 0 10px var(--lc); }

.tk-head { display: flex; justify-content: space-between; gap: 10px; font: 800 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 6px 0 12px; border-bottom: 4px solid var(--ink); }

.stamp .px { height: 42px; }

@keyframes stampHit { from { transform: rotate(-8deg) scale(2.2); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
.tk-rows { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 4px dashed var(--ink); padding-top: 14px; }

.tk-promo { margin-top: 14px; padding: 10px; background: var(--ink); color: var(--amber); font: 800 13px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.tk-code { height: 28px; margin-top: 14px; background: repeating-linear-gradient(90deg, var(--ink) 0 4px, transparent 4px 8px, var(--ink) 8px 10px, transparent 10px 16px, var(--ink) 16px 22px, transparent 22px 26px); }
.ticket-view .actions { margin-top: auto; display: grid; gap: 10px; animation: viewIn .3s steps(4) 1.1s both; }

/* ---------- depot / exam ---------- */
.mode { display: flex; gap: 14px; align-items: center; }
button.mode:active { transform: translateY(4px); }
.mode .ico { flex: none; width: 52px; height: 52px; display: grid; place-items: center; color: var(--ink); background: var(--amber); clip-path: var(--notch); box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .25), inset 0 4px 0 rgba(255, 255, 255, .4); padding-bottom: 4px; }
.mode .ico.red { background: var(--red); } .mode .ico .px-icon { height: 21px; }

.bay { display: grid; gap: 8px; }
.bay-item { padding: 11px 12px; background: var(--ink); border-left: 8px solid var(--lc); font-size: 14.5px; overflow-wrap: anywhere; }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.facts.four { grid-template-columns: repeat(4, 1fr); margin-top: 16px; }
.facts > div { background: var(--ink); padding: 12px 4px; text-align: center; }

.mix { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; margin-top: 12px; font-size: 14px; font-weight: 650; } .mix .num { font-size: 12px; }
.meter { grid-column: 1 / -1; height: 8px; background: var(--ink); position: relative; }
.meter i { display: block; height: 100%; background: var(--lc); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .3); transition: width .5s steps(10); }

.pill.pass { background: var(--green); } .pill.fail { background: var(--red); }
.exam-top { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; background: var(--ink); }
.timer { padding: 9px 10px; background: #0d0e17; color: var(--amber); box-shadow: inset 0 0 0 2px var(--edge); font-size: 15px; } .timer .px { height: 14px; }
.timer.low { color: var(--red); animation: blink 1s steps(1) infinite; }
.count { margin: 0 auto; font-weight: 800; font-size: 14px; color: var(--muted); }
.exam-prog { height: 4px; background: var(--panel-2); flex: none; } .exam-prog i { display: block; height: 100%; background: var(--amber); transition: width .2s steps(4); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; max-height: 44vh; overflow-y: auto; padding: 4px; margin: 12px 0 16px; }
.grid button { height: 44px; background: var(--ink); font: 800 13.5px/1 var(--mono); color: var(--muted); position: relative; box-shadow: inset 0 0 0 2px var(--edge); }
.grid button.ans { background: var(--amber); color: var(--ink); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25); }
.grid button.cur { outline: 4px solid var(--text); outline-offset: 0; }
.grid button.flag::after { content: ""; position: absolute; top: 0; right: 0; width: 12px; height: 12px; background: var(--red); box-shadow: 0 0 0 2px var(--ink); }
.score { display: grid; justify-items: center; gap: 16px; margin: 26px 0 12px; }
.score-num { display: block; font-size: 44px; } .score-num .px { height: 56px; } .score-num.green { color: var(--green); } .score-num.red { color: var(--red); }
.score-bar { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; width: 100%; max-width: 320px; height: 24px; position: relative; padding: 4px; background: var(--ink); box-shadow: inset 0 0 0 2px var(--edge); }
.score-bar i { background: var(--panel-2); } .score-bar.green i.on { background: var(--green); } .score-bar.red i.on { background: var(--red); }
.score-bar u { position: absolute; top: -6px; bottom: -6px; width: 4px; margin-left: -2px; background: var(--text); }
.verdict-word { text-align: center; font: 800 16px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; animation: blink .5s steps(1) 3 1.6s; }
.verdict-word.green { color: var(--green); } .verdict-word.red { color: var(--red); }
.rev .q-text { font-size: 16.5px; } .rev .opts { gap: 6px; }
.rev .opt { min-height: 0; padding: 10px 12px; font-size: 14.5px; animation: none; box-shadow: inset 0 0 0 4px var(--edge); clip-path: none; } .rev .opt.right { box-shadow: inset 0 0 0 4px var(--green); } .rev .opt.miss { box-shadow: inset 0 0 0 4px var(--red); }
.rev .opt .key { width: 24px; height: 24px; font-size: 12px; }
.rev .lever { animation: none; grid-template-columns: 1fr 1fr; } .rev .lv-track { display: none; } .rev .lv-side { padding: 10px; grid-auto-flow: column; justify-content: center; align-items: center; font-size: 13px; clip-path: none; } .rev .lv-ico { width: 28px; height: 28px; } .rev .lv-ico .px-icon { height: 14px; }
.rev .yours { margin-top: 10px; text-transform: none; letter-spacing: 0; font: 600 13px/1.5 var(--sans); }

/* ---------- log ---------- */
.rank-top { display: flex; gap: 14px; align-items: center; }
.plate { flex: none; width: 64px; height: 64px; display: grid; place-items: center; color: var(--ink); background: var(--amber); clip-path: var(--notch); box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .25), inset 0 4px 0 rgba(255, 255, 255, .45); padding-bottom: 4px; } .plate .px { height: 21px; }
.rank h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; } .rank small { display: block; margin-top: 6px; font-size: 11.5px; }
.odo-big { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.reel { display: flex; gap: 4px; align-items: center; }
.reel span { width: 26px; height: 36px; display: grid; place-items: center; background: var(--ink); color: var(--text); box-shadow: inset 0 0 0 2px var(--edge); } .reel .px { height: 14px; }
.reel span:last-of-type { background: var(--red-dk); }

.sp { margin-bottom: 16px; }
.sp-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; margin-bottom: 8px; } .sp-head .num { font-size: 12px; white-space: nowrap; }
.leds { display: grid; grid-template-columns: repeat(auto-fill, 16px); gap: 4px; padding: 8px; background: var(--ink); }
.leds .led { width: 16px; height: 16px; position: relative; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .3), inset 0 4px 0 rgba(255, 255, 255, .25); }
.leds .led::after { content: ""; position: absolute; inset: -2px; }
.leds .led:hover, .leds .led:focus-visible { outline: 4px solid var(--text); outline-offset: 0; z-index: 1; }
.led.m0 { background: var(--m0); } .led.m1 { background: var(--m1); } .led.m2 { background: var(--m2); } .led.m3 { background: var(--m3); }
.leds .led.m0 { box-shadow: none; }
.leds.none { height: 32px; background: repeating-linear-gradient(135deg, var(--ink) 0 8px, var(--panel-2) 8px 16px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding-top: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend .led { width: 10px; height: 10px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 138px; position: relative; padding-top: 20px; }
.week .col { display: grid; grid-template-rows: 1fr auto; justify-items: center; height: 100%; gap: 6px; font: 800 11px/1 var(--mono); color: var(--faint); }
.week .bar { align-self: end; width: 16px; background: var(--amber); box-shadow: inset -4px 0 0 rgba(0, 0, 0, .2); position: relative; }
.week .bar.zero { background: var(--edge); box-shadow: none; }
.week .bar em { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); font-style: normal; color: var(--text); font-size: 11px; visibility: hidden; }
.week .col:hover .bar em, .week .col.today .bar em { visibility: visible; }
.week .col.today { color: var(--text); }
.week .goal { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--edge-2); pointer-events: none; }
.week .goal span { position: absolute; left: 0; bottom: 2px; font-size: 10px; color: var(--muted); background: var(--panel); padding-right: 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 4px solid var(--panel-2); font-weight: 650; }
.set-row:last-child { border-bottom: 0; }
.seg { display: inline-flex; background: var(--ink); padding: 4px; }
.seg button { padding: 6px 12px; font-size: 13.5px; font-weight: 800; color: var(--muted); } .seg button.on { background: var(--amber); color: var(--ink); }
.switch { width: 52px; height: 28px; background: var(--ink); position: relative; flex: none; box-shadow: inset 0 0 0 2px var(--edge); }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; background: var(--faint); transition: transform .1s steps(3); }
.switch.on::after { transform: translateX(24px); background: var(--green); box-shadow: inset 0 -4px 0 var(--green-dk); }
.link-danger { color: var(--red); font: 800 13px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 10px 2px; }

@media (prefers-reduced-motion: reduce) {

}

<script>
// Game rules and progress bookkeeping. No DOM in here, so it runs in Node for tests.
(function (root) {
  'use strict';

  var RANKS = [0, 100, 300, 600, 1000, 1600, 2400, 3500];
  var DAILY_GOAL = 50;
  var MASTERED_STREAK = 2; // consecutive correct answers that clear a question from the repair shop

  function shuffle(arr, rng) {
    rng = rng || Math.random;
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function dateKey(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function newState() {
    return {
      v: 1, xp: 0, streak: { count: 0, last: '' }, days: {}, q: {}, stations: {}, exams: [],
      settings: { lang: '', sound: true, haptic: true, shuffle: false },
    };
  }

  function byCategory(bank, catId) {
    return bank.questions.filter(function (q) { return q.cat === catId; });
  }

  /** Split a category into stations (levels) of fixed size, in bank order. A short tail joins the previous station. */
  function stationsFor(bank, catId) {
    var size = bank.meta.questionsPerStation || 6;
    var qs = byCategory(bank, catId);
    var out = [];
    for (var i = 0; i < qs.length; i += size) out.push(qs.slice(i, i + size));
    if (out.length > 1 && out[out.length - 1].length < Math.ceil(size / 2)) {
      var tail = out.pop();
      out[out.length - 1] = out[out.length - 1].concat(tail);
    }
    return out;
  }

  function stationKey(catId, index) { return catId + ':' + index; }

  /** Index of the first station on a line without stars (the one the train is heading to). */
  function currentStation(state, catId, count) {
    for (var i = 0; i < count; i++) if (!state.stations[stationKey(catId, i)]) return i;
    return count; // line complete
  }

  function isCorrect(q, chosen) {
    if (!chosen || chosen.length !== q.ans.length) return false;
    var s = chosen.slice().sort(function (a, b) { return a - b; });
    for (var i = 0; i < s.length; i++) if (s[i] !== q.ans[i]) return false;
    return true;
  }

  var GRADES = ['', 'C', 'B', 'A', 'S'];
  /** Grade for a run from the share of questions answered right first time: 4 = S, 3 = A, 2 = B, 1 = C. */
  function gradeFor(firstTry, total) {
    var acc = total ? firstTry / total : 0;
    return acc >= 1 ? 4 : acc >= 0.8 ? 3 : acc >= 0.6 ? 2 : 1;
  }

  function xpFor(combo) { return 10 + Math.min(Math.max(combo - 1, 0), 5) * 2; }

  function rankOf(xp) {
    var level = 0;
    for (var i = 0; i < RANKS.length; i++) if (xp >= RANKS[i]) level = i;
    var next = RANKS[level + 1];
    return {
      level: level, floor: RANKS[level], next: next || null,
      progress: next ? (xp - RANKS[level]) / (next - RANKS[level]) : 1,
    };
  }

  function touchStreak(state, now) {
    var today = dateKey(now);
    if (state.streak.last === today) return;
    var yesterday = dateKey(now - 864e5);
    state.streak.count = state.streak.last === yesterday ? state.streak.count + 1 : 1;
    state.streak.last = today;
  }

  /** Streak as it should be displayed: it lapses if neither today nor yesterday was played. */
  function liveStreak(state, now) {
    var last = state.streak.last;
    return last === dateKey(now) || last === dateKey(now - 864e5) ? state.streak.count : 0;
  }

  function addXp(state, amount, now) {
    state.xp += amount;
    var k = dateKey(now);
    state.days[k] = (state.days[k] || 0) + amount;
    touchStreak(state, now);
  }

  /** Record one answered question. Returns the question's updated stats. */
  function recordAnswer(state, q, correct, now) {
    var s = state.q[q.id] || (state.q[q.id] = { n: 0, c: 0, k: 0, w: 0, t: 0 });
    s.n++; s.t = now;
    if (correct) {
      s.c++; s.k++;
      if (s.w && s.k >= MASTERED_STREAK) s.w = 0;
    } else { s.k = 0; s.w = 1; }
    return s;
  }

  function wrongList(bank, state) {
    return bank.questions.filter(function (q) { var s = state.q[q.id]; return s && s.w; });
  }

  /** 0 unseen, 1 weak, 2 learning, 3 mastered */
  function masteryOf(state, q) {
    var s = state.q[q.id];
    if (!s || !s.n) return 0;
    if (s.w || s.k === 0) return 1;
    return s.k >= MASTERED_STREAK ? 3 : 2;
  }

  function categoryStats(bank, state, catId) {
    var qs = byCategory(bank, catId);

<script>
// Pixel-art station platform for the home screen: a high-speed train waiting under the canopy,

(function (root) {

    { sky: ['#1a1c2c', '#1a1c2c', '#20243f', '#29366f'], orb: '#f4f4f4', city: '#29366f', cityDk: '#20243f', win: '#ffcd75', cloud: '#333c57', stars: true },

      // canopy roof with lamps

          h('div', null, h('b', { class: 'num' }, answered ? Math.round(correct / answered * 100) + '%' : '–'), h('small', null, t('accuracy'))),
          h('div', null, h('b', { class: 'num' }, clearedCount()), h('small', null, t('cleared'))))),

      h('div', { class: 'label', style: 'margin:22px 2px 4px' }, t('panel')),
      h('p', { class: 'muted', style: 'margin:0 2px 10px;font-size:13.5px' }, t('panelSub')),
      h('section', { class: 'panel' },
        lines.map(function (l) {
          var qs = E.byCategory(bank, l.cat.id), s = E.categoryStats(bank, state, l.cat.id);
          return h('div', { class: 'sp', style: '--lc:' + l.color },
            h('div', { class: 'sp-head' }, h('span', null, h('i', { class: 'dot' }), I.catName(l.cat)), h('span', { class: 'num muted' }, qs.length ? s.mastered + ' / ' + s.total : t('building'))),
            qs.length ? h('div', { class: 'leds' }, qs.map(function (q) {
              var m = E.masteryOf(state, q);
              return h('button', { class: 'led m' + m, 'aria-label': t(KEYS[m]) + ': ' + q.q, onclick: function () { Fx.play('tap'); inspect(q, l); } });
            })) : h('div', { class: 'leds none' }));
        }),
        h('div', { class: 'legend' }, KEYS.slice().reverse().map(function (k) { return h('span', null, h('i', { class: 'led m' + KEYS.indexOf(k) }), t(k)); }))),

      h('div', { class: 'label', style: 'margin:22px 2px 10px' }, t('week')),
      h('section', { class: 'panel' },
        h('div', { class: 'muted num', style: 'font-size:13px;margin-bottom:4px' }, t('dailyGoal') + ' · ' + Math.min(today, E.DAILY_GOAL) + ' / ' + E.DAILY_GOAL + ' ' + t('km')),
        h('div', { class: 'week' },
          h('div', { class: 'goal', style: 'bottom:' + (24 + E.DAILY_GOAL / peak * PLOT) + 'px' }, h('span', { class: 'num' }, E.DAILY_GOAL)),
          days.map(function (x) {
            return h('div', { class: 'col' + (x.today ? ' today' : ''), title: x.xp + ' ' + t('km') },
              h('div', { class: 'bar' + (x.xp ? '' : ' zero'), style: 'height:' + Math.max(2, x.xp / peak * PLOT) + 'px' }, h('em', { class: 'num' }, x.xp)), h('span', null, x.label));
          }))),

      h('div', { class: 'label', style: 'margin:22px 2px 10px' }, t('settings')),
      h('section', { class: 'panel', style: 'padding-top:4px;padding-bottom:4px' },
        h('div', { class: 'set-row' }, t('language'), h('div', { class: 'seg' },
          h('button', { class: lang === 'en' ? 'on' : '', onclick: function () { setting('lang', 'en'); } }, 'English'),
          h('button', { class: lang === 'zh' ? 'on' : '', onclick: function () { setting('lang', 'zh'); } }, '中文'))),
        h('div', { class: 'set-row' }, t('sound'), toggle('sound')),
        h('div', { class: 'set-row' }, t('haptic'), toggle('haptic')),
        h('div', { class: 'set-row' }, t('shuffleOpts'), toggle('shuffle'))),
      h('p', { class: 'muted', style: 'margin:14px 2px 4px;font-size:13px' }, t('bankInfo', { n: bank.questions.length }) + (bank.meta.sample ? ' · ' + t('sampleNote') : '')),
      h('button', {
        class: 'link-danger', onclick: function () {
          confirmBox(t('reset'), t('resetQ'), t('resetYes'), t('cancel'), true).then(function (y) {
            if (!y) return;
            var keep = state.settings; state = E.newState(); state.settings = keep; ui.sel = null; save(); go('log');
          });
        },
      }, t('reset')))));
  }

  /* ---------- boot ---------- */
  applySettings();
  go('home');
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ });
})();
</script>
</body>
</html>
